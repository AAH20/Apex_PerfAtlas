name: Evidence correctness and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]' build
      - run: python -m pytest -q
      - run: apex-atlas validate examples/design-only.json
      - run: apex-atlas suggest STAC-T0
      - run: apex-atlas economics examples/cost-scenario.json
      - run: python -m build
